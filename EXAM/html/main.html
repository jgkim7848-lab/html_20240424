<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>

    <style>
        .black {
            background-image: url(../image/blackstick.jpg);
        }

        .white {
            background-image: url(../image/whitestick.gif);
        }

        .blackandwhite {
            background-image: url(../image/balckandwhite.webp);
            position: relative;
        }

        .hook {
            background-image: url(../image/hook.jpg);
        }

        .black,
        .white,
        .blackandwhite,
        .hook {
            width: 100%;
            height: 400px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Mobile */
        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .word {
            height: 200px;
        }

        .wordtop {
            font-size: 16px;
            color: #4A4A4A;
        }

        .wordmid {
            font-size: 20px;
            color: #1B1B1B;
            margin-top: 10px;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .wordfoot {
            font-size: 16px;
            color: #7A7A7A;
        }

        p {
            margin-left: 30px;
            margin-right: 30px;
        }



        /* VIEW MORE */
        .viewmore {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 60px;
            border: 4px solid white;
            color: white;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;

            box-sizing: border-box;
        }



        /* Tablet */
        @media screen and (min-width:768px) {
            p {
                margin-left: 65px;
                margin-right: 65px;
            }

            .middest {
                display: flex;
            }

            .white {
                width: 50%;
                height: 800px;
            }

            .smallest {
                width: 50%;
            }

            .blackandwhite,
            .hook {
                height: 400px;
            }
        }





        /* Desktop */
        @media screen and (min-width:1024px) {
            .container {
                flex-direction: row;
                height: 100vh;
                gap: 0;
            }

            .black {
                flex: 1;
                height: 100vh;
            }

            .biggest {
                flex: 1;
                display: flex;
                flex-direction: column;
                height: 100vh;
            }

            .word {
                flex: 1;
                height: auto;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .middest {
                flex: 1;
                display: flex;
            }

            .white {
                flex: 1;
                height: 100%;
            }

            .smallest {
                flex: 1;
                display: flex;
                flex-direction: column;
            }

            .blackandwhite,
            .hook {
                flex: 1;
                height: auto;
            }
        }
    </style>

</head>

<body>

    <div class="container">
        <div class="black"></div>
        <div class="biggest">
            <div class="word">
                <p class="wordtop">Portfolio</p>
                <p class="wordmid">Make Hardware Soft</p>
                <p class="wordfoot">
                    이노는 행거 타입 블루투스 스피커로서 오디오 리쳐에 집중하지 않으며
                    이것은 자연적으로 너의 인생을 미니멀 디자인으로 만들어버리는
                    사악한 물건인 것이다.
                </p>
            </div>
            <div class="middest">
                <div class="white"></div>
                <div class="smallest">
                    <div class="blackandwhite">
                        <div class="viewmore">
                            VIEW MORE
                        </div>
                    </div>
                    <div class="hook"></div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button {
            width: auto;
            height: 150px;
            font-size: 30px;
        }
    </style>
</head>

<body>
    <div>
        <button id="random">랜덤 숫자 생성 버튼</button>
        <button id="reset">다시시도</button>
        <h1 id="printMsg"></h1>
    </div>

    <div>
        <input type="text" id="myNum">
        <button id="compareNum">제출</button>
        <h1 id="result"></h1>
    </div>

    <script>
        let compnum = 0;
        let humannum = 0;

        document.getElementById('random').addEventListener('click', function () {
            //랜덤 숫자 생성
            compnum = Math.floor(Math.random() * 100) + 1;
            console.log(compnum);

            document.getElementById('printMsg').innerHTML = `랜덤 숫자 생성(1~100)이 완료되었습니다.<br>`;

        })

        document.getElementById('reset').addEventListener('click', function () {
            //랜덤 숫자 생성의 취소
            //해놨던거 다 사라져야됨
            compnum = 0;
            document.getElementById('printMsg').innerText = "";
            document.getElementById('result').innerText = "";
            document.getElementById('printMsg').innerText = "랜덤 숫자가 0으로 리셋되었습니다. 생성 버튼을 다시 눌러주세요.";

            console.log(compnum);

        })

        document.getElementById('compareNum').addEventListener('click', function () {

            humannum = Number(document.getElementById('myNum').value);
            document.getElementById('myNum').value = '';
            //input은 내용이 innertext에 들어가있는게 아니라 value에 들어가있기때문에
            //.innerText = "";로 해도 적혀있던 값이 사라지지않음.
            //.value = '';로 했을 경우에만 적어놨던게 사라짐.
            console.log(humannum);

            

            if (humannum > 100 || humannum < 0) {
                document.getElementById('printMsg').innerHTML += `숫자 입력값 1~100을 벗어났습니다. 다시 입력해주세요.<br>`;



            } else {

                if (compnum > humannum) {
                    document.getElementById('printMsg').innerHTML += `${humannum}보다 더 큰 숫자를 입력해주세요<br>`;

                } else if (compnum < humannum) {
                    document.getElementById('printMsg').innerHTML += `${humannum}보다 더 작은 숫자를 입력해주세요<br>`;

                } else {
                    document.getElementById('printMsg').innerText = "";
                    document.getElementById('result').innerHTML = `${humannum} 정답입니다.`;


                }




            }



        });

    </script>





</body>

</html>

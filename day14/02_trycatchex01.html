<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <fieldset>
        숫자: <input type="text" id="number">
        <button id="printBtn">print</button>
        <h3 id="printResult"></h3>
    </fieldset>

    <script>
        //input에 숫자만 들어올수있게 try catch로 체크
        //숫자가 아니면 printresult에서 숫자만 입력해주세요 throw로 에러처리
        //숫자가 입력되면 숫자값에 *2한 결과를 printResult에 출력

        const number = document.getElementById('number');
/*        document.getElementById('printBtn').addEventListener('click', () => {
            if (isNaN(number.value)) {
                document.getElementById('printResult').innerText = "숫자만 입력해주세요";
            } else {
                document.getElementById('printResult').innerHTML = `${Number(number.value) * 2}`;

            }

        })*/



document.getElementById('printBtn').addEventListener('click', () => {

    try {

        let result = Number(number.value);

        if (isNaN(result)) {
            throw new Error("숫자만 입력해주세요");
        }

        document.getElementById('printResult').innerText = result * 2;

    } catch(error) {

        document.getElementById('printResult').innerText = error.message;

    }

})



    </script>

</body>

</html>

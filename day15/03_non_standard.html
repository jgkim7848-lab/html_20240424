<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>
        non standard attribute 비표준속성

    </h1>

    <!-- 
        속성: attribute는!! element에 달리는 여러가지 속성들을 의미함.
        객체명.속성명  

        모든 element마다 본인의 기본 속성을 가지고있다. == 표준속성
        각자의 element 속성은 속성 자체가 특정 기능을 가지고있다.
        속성이 제한적임. (자기 입장에선 지한테 필요한거 알아서 갖고있음)
        개발자 입장에서 필요한 속성을 직접 달아주는걸 비표준 속성이라고 함..  내가 직접 제공함.
        비표준속성 이건 백엔드에서 많이 쓰는편

        너무 많이 쓰면 개발 효율과 가독성 저하됨.ㅌ


    -->



    <input type="text" name="" id="" value="" placeholder="" readonly required disabled>

    <ul>
        <li class="list" data-title="제목">비표준속성 사용방법</li>
        <li class="list">data-변수명 = "값"
            dataset property를 사용하여 읽어들임
        </li>
        <li class="list">
            변수명에 대문자는 허용하지않는다.
            대문자를 쓰더라도 소문자로만 인식하게된다.
        </li>
    </ul>



    <script>
        let li_list = document.querySelectorAll(".list");
        console.log(li_list);

        console.log(li_list[0].dataset.title);
        let age = li_list[1].dataset.age;
        let no = li_list[1].dataset.no;
        console.log(age, no);

        console.log(li_list[2].dataset.objectNum);
        console.log(li_list[2].dataset.objectnum);
        

    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>
        popup => window 메서드 종류
    </h1>
    <!-- 
        alert() / prompt() : input / confirm() : 확인/취소
        window.open('url', 'window name', option(size, scroll));
        window.close();
     -->
    <button onclick="openWinodw()">popup 열기</button>
    <button onclick="closeWindow()">popup 닫기</button>
    <button onclick="alertEx()">alert</button>
    <button onclick="promptEx()">prompt</button>
    <button onclick="confirmEx()">confirm</button>

    <h3 id="h3"></h3>

    <script>
        function confirmEx(){
            let con = confirm('확인하시겠습니까?'); // true / false
            /*
            if(con){
                document.getElementById('h3').innerText = '확인';
            }else{
                document.getElementById('h3').innerText = '취소';
            }
            */

            document.getElementById('h3').innerText = con ? "확인" : "취소";

        }
        function promptEx(){
            // input
            let name = prompt('값을 입력해주세요');
            document.getElementById('h3').innerText = name;
        }

        function alertEx(){
            alert('alert 창 입니다.~!!');
        }

        let popup;
        function openWinodw(){
            popup = window.open('01_BOM.html','mypop','width=400, heigth=500');
        }

        function closeWindow(){
            if(popup){
                popup.close();
            }
        }
    </script>
</body>
</html>

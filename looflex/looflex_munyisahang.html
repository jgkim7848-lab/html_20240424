<head>

    <style>
        /* ======================================================
   문의사항 페이지   muny
====================================================== */

        .sahang {
            width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        /* ======================================================
   상단
====================================================== */

        .uppestside {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .left_m {
            font-size: 32px;
            font-weight: bold;
        }


        /* ======================================================
   헤더 분류 영역
====================================================== */

        .classification {
            display: flex;
            align-items: center;

            min-height: 65px;

            background: #f3f4f6;

            border-top: 2px solid #222;
            border-bottom: 2px solid #ddd;

            font-weight: bold;
        }

        .classification div {
            padding: 15px;
            text-align: center;
            box-sizing: border-box;
        }

        /* 폭 */
        .dapbyeon_m,
        .zaksung_who,
        .zaksung_date {
            width: 15%;
        }

        .question_m {
            width: 55%;
        }

        /* ======================================================
   게시글 리스트
====================================================== */

        .question-row {
            display: flex;
            align-items: center;

            min-height: 70px;

            background: white;

            border-bottom: 1px solid #ececec;

            cursor: pointer;
            transition: 0.2s;
        }

        .question-row:hover {
            background: #f8f9fb;
        }

        .question-row>div {
            padding: 18px;
            text-align: center;
            box-sizing: border-box;
        }

        .state,
        .writer,
        .date {
            width: 15%;
        }

        .question {
            width: 55%;

            text-align: left !important;

            font-weight: 500;

            word-break: break-word;
        }

        /* ======================================================
   답변 박스
====================================================== */

        .answer-box {
            display: none;

            background: #f8f9fc;

            padding: 25px;

            border-bottom: 1px solid #e6e6e6;

            line-height: 1.8;

            animation: fadeIn 0.2s ease;
        }

        .answer-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        /* 부드럽게 열림 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ======================================================
   글쓰기 버튼
====================================================== */

        .write-box {
            margin-top: 25px;
            text-align: right;
        }

        .write-box button {
            padding: 12px 20px;

            border: none;
            border-radius: 10px;

            background: black;
            color: white;

            cursor: pointer;

            font-size: 15px;

            margin-bottom: 25px;
        }

        .write-box button:hover {
            opacity: 0.85;
        }

        /* ======================================================
   페이지 버튼
====================================================== */

        .page_m {
            display: flex;
            justify-content: center;
            gap: 10px;

            margin-top: 35px;
        }

        .page_m button {
            min-width: 42px;
            height: 42px;

            border: 1px solid #ddd;
            border-radius: 10px;

            background: white;

            cursor: pointer;

            transition: 0.2s;
        }

        .page_m button:hover {
            background: #ececec;
        }

        /* ======================================================
   검색
====================================================== */

        .searchbox_m {
            display: flex;
            justify-content: center;
            gap: 10px;

            margin-top: 25px;
        }

        .searchbox_m input {
            width: 260px;
            height: 45px;

            padding: 0 15px;

            border: 1px solid #ddd;
            border-radius: 10px;

            outline: none;
        }

        .searchbox_m input:focus {
            border-color: #999;
        }

        .searchbox_m button {
            height: 45px;
            /* 검색창 높이와 맞춤 */
            padding: 0 18px;

            border: none;
            border-radius: 10px;

            background: black;
            color: white;

            cursor: pointer;
        }

        /* ======================================================
   반응형
====================================================== */

        @media (max-width: 950px) {

            .sahang {
                width: 95%;
            }

            #writeForm {
                flex-direction: column;
            }
        }

        .left_m {
            font-size: 26px;
        }

        .question-row {
            font-size: 14px;
        }

        .write-box input {
            width: 220px;
            height: 40px;

            padding: 0 12px;

            border: 1px solid #ddd;
            border-radius: 10px;

            margin-right: 10px;
        }

        #writeForm {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

            margin-top: 15px;
        }

        #writeForm input {
            width: 220px;
            height: 45px;

            padding: 0 15px;

            border: 1px solid #ddd;
            border-radius: 10px;

            box-sizing: border-box;
        }

        #writeForm button {
            height: 45px;

            padding: 0 20px;

            border: none;
            border-radius: 10px;

            background: black;
            color: white;

            cursor: pointer;
        }
    </style>
</head>

            { id: "line37", QAyabu: "답변 완료", Q: "로그인 알림은 제공되나요?", Qman: "데이터 받아와야됨", date: "2026-04-20", QA: "새 기기 로그인 시 이메일로 알림이 발송됩니다." },
            { id: "line38", QAyabu: "답변 완료", Q: "화면 회전은 지원되나요?", Qman: "데이터 받아와야됨", date: "2026-04-19", QA: "모바일 앱에서 자동 회전이 지원됩니다." },
            { id: "line39", QAyabu: "답변 완료", Q: "결제 내역은 어디서 확인하나요?", Qman: "데이터 받아와야됨", date: "2026-04-18", QA: "마이페이지 > 결제 내역에서 확인 가능합니다." },
            { id: "line40", QAyabu: "답변 완료", Q: "영상 화질 자동 조정이 되나요?", Qman: "데이터 받아와야됨", date: "2026-04-17", QA: "네트워크 환경에 따라 자동으로 화질이 조정됩니다." },
            { id: "line41", QAyabu: "답변 완료", Q: "계정 복구는 어떻게 하나요?", Qman: "데이터 받아와야됨", date: "2026-04-16", QA: "비밀번호 재설정 또는 고객센터를 통해 복구 가능합니다." },
            { id: "line42", QAyabu: "답변 완료", Q: "결제 영수증은 이메일로 오나요?", Qman: "데이터 받아와야됨", date: "2026-04-15", QA: "결제 완료 후 이메일로 영수증이 발송됩니다." },
            { id: "line43", QAyabu: "답변 완료", Q: "영상 다운로드 제한은 있나요?", Qman: "데이터 받아와야됨", date: "2026-04-14", QA: "최대 10개 콘텐츠까지 다운로드 가능합니다." },
            { id: "line44", QAyabu: "답변 완료", Q: "결제 환불은 언제 처리되나요?", Qman: "데이터 받아와야됨", date: "2026-04-13", QA: "환불은 신청 후 3~5일 내 처리됩니다." },
            { id: "line45", QAyabu: "답변 완료", Q: "영상 공유 기능이 있나요?", Qman: "데이터 받아와야됨", date: "2026-04-12", QA: "SNS 공유 버튼을 통해 가능합니다." },
            { id: "line46", QAyabu: "답변 완료", Q: "계정 비밀번호는 몇 자리인가요?", Qman: "데이터 받아와야됨", date: "2026-04-11", QA: "최소 8자리 이상 설정해야 합니다." },
            { id: "line47", QAyabu: "답변 완료", Q: "결제 알림을 끌 수 있나요?", Qman: "데이터 받아와야됨", date: "2026-04-10", QA: "앱 설정에서 알림을 끌 수 있습니다." },
            { id: "line48", QAyabu: "답변 완료", Q: "영상 이어보기 기능이 있나요?", Qman: "데이터 받아와야됨", date: "2026-04-09", QA: "중단한 위치부터 이어서 시청 가능합니다." },
            { id: "line49", QAyabu: "답변 완료", Q: "계정 정지 해제는 어떻게 하나요?", Qman: "데이터 받아와야됨", date: "2026-04-08", QA: "고객센터 문의 후 심사 과정을 거쳐 해제됩니다." },
            { id: "line50", QAyabu: "답변 완료", Q: "결제 수단 추가는 가능한가요?", Qman: "데이터 받아와야됨", date: "2026-04-07", QA: "마이페이지 > 결제 관리에서 추가 가능합니다." },
            { id: "line51", QAyabu: "답변 완료", Q: "영상 추천은 어떻게 받나요?", Qman: "데이터 받아와야됨", date: "2026-04-06", QA: "시청 기록과 선호 장르 기반으로 추천됩니다." },
            { id: "line52", QAyabu: "답변 완료", Q: "계정 이메일 변경은 어떻게 하나요?", Qman: "데이터 받아와야됨", date: "2026-04-05", QA: "마이페이지 > 계정 관리에서 변경 가능합니다." },
            { id: "line53", QAyabu: "답변 완료", Q: "결제 취소 후 환불은 언제 되나요?", Qman: "데이터 받아와야됨", date: "2026-02-02", QA: "환불은 영업일 기준 3~5일 내 처리됩니다." }
        ];

        const questionList =
            document.getElementById("question-list");

        const pageButtons =
            document.getElementById("page-buttons");

        const itemsPerPage = 10;

        let currentPage = 1;
        let openedAnswer = null;


        // =============================
        // 페이지 렌더링
        // =============================
        function renderPage(page) {

            // 기존 화면 제거
            questionList.innerHTML = "";

            openedAnswer = null;

            // 시작번호
            const start =
                (page - 1) * itemsPerPage;

            // 끝번호
            const end =
                start + itemsPerPage;

            // 현재 페이지 데이터
            const currentData =
                Mdata.slice(start, end);

            currentData.forEach((item) => {

                // 게시글 한 줄
                const row =
                    document.createElement("div");

                row.className =
                    "question-row";

                row.innerHTML = `
            <div class="state">
                ${item.QAyabu}
            </div>

            <div class="question">
                ${item.Q}
            </div>

            <div class="writer">
                ${item.Qman}
            </div>

            <div class="date">
                ${item.date}
            </div>
        `;


                // 답변 박스
                const answerBox =
                    document.createElement("div");

                answerBox.className =
                    "answer-box";

                answerBox.innerHTML = `
            <div class="answer-title">
                답변
            </div>

            <div>
                ${item.QA || "답변이 없습니다."}
            </div>
        `;


                // 클릭 이벤트
                row.addEventListener("click", () => {

                    if (
                        item.QAyabu !==
                        "답변 완료"
                    ) {
                        return;
                    }

                    // 이전 거 닫기
                    if (
                        openedAnswer &&
                        openedAnswer !== answerBox
                    ) {
                        openedAnswer.style.display =
                            "none";
                    }

                    // 토글
                    if (
                        answerBox.style.display ===
                        "block"
                    ) {

                        answerBox.style.display =
                            "none";

                        openedAnswer = null;

                    } else {

                        answerBox.style.display =
                            "block";

                        openedAnswer = answerBox;
                    }
                });

                questionList.appendChild(row);
                questionList.appendChild(answerBox);
            });
        }



        // =============================
        // 페이지 버튼 생성
        // =============================
        function renderPageButtons() {

            pageButtons.innerHTML = "";

            const totalPages =
                Math.ceil(
                    Mdata.length /
                    itemsPerPage
                );

            for (
                let i = 1;
                i <= totalPages;
                i++
            ) {

                const btn =
                    document.createElement(
                        "button"
                    );

                btn.innerText = i;

                btn.addEventListener(
                    "click",
                    () => {

                        currentPage = i;

                        renderPage(
                            currentPage
                        );
                    }
                );

                pageButtons.appendChild(
                    btn
                );
            }
        }



        // =============================
        // 글쓰기용 함수 (미리 준비)
        // =============================
        function addQuestion(
            question,
            writer
        ) {

            const newId =
                "line" +
                (Mdata.length + 1);

            Mdata.unshift({

                id: newId,

                QAyabu:
                    "답변 대기",

                Q: question,

                Qman: writer,

                date:
                    new Date()
                        .toISOString()
                        .split("T")[0],

                QA: ""
            });

            // 버튼 재계산
            renderPageButtons();

            // 첫페이지 이동
            currentPage = 1;

            renderPage(
                currentPage
            );
        }



        // 최초 실행
        renderPageButtons();
        renderPage(currentPage);


        // ======================================
        // 기본 설정
        // ======================================

        // 되돌리기 버튼 처음 숨기기
        document.getElementById(
            "resetBtn_m"
        ).style.display = "none";


        // ======================================
        // 검색 기능
        // ======================================

        document.getElementById(
            "searchBtn_m"
        ).addEventListener(
            "click",
            () => {

                const keyword =
                    document.getElementById(
                        "searchInput_m"
                    )
                        .value
                        .trim();

                // 검색어 없으면 종료
                if (keyword === "") {
                    return;
                }

                // 제목 검색
                const result =
                    Mdata.filter(item =>
                        item.Q.includes(
                            keyword
                        )
                    );

                // 기존 리스트 제거
                questionList.innerHTML =
                    "";

                // 페이지 버튼 숨기기
                pageButtons.style.display =
                    "none";

                // 검색 결과 없음
                if (
                    result.length === 0
                ) {

                    questionList.innerHTML =
                        `
                <div style="
                    text-align:center;
                    padding:50px;
                    color:gray;
                ">
                    검색 결과가 없습니다.
                </div>
            `;

                } else {

                    result.forEach(
                        (item) => {

                            const row =
                                document.createElement(
                                    "div"
                                );

                            row.className =
                                "question-row";

                            row.innerHTML =
                                `
                    <div class="state">
                        ${item.QAyabu}
                    </div>

                    <div class="question">
                        ${item.Q}
                    </div>

                    <div class="writer">
                        ${item.Qman}
                    </div>

                    <div class="date">
                        ${item.date}
                    </div>
                    `;

                            // 답변박스
                            const answerBox =
                                document.createElement(
                                    "div"
                                );

                            answerBox.className =
                                "answer-box";

                            answerBox.innerHTML =
                                `
                        <div class="answer-title">
                            답변
                        </div>

                        <div>
                            ${item.QA ||
                                "답변이 없습니다."
                                }
                        </div>
                    `;

                            // 클릭 이벤트
                            row.addEventListener(
                                "click",
                                () => {

                                    if (
                                        item.QAyabu !==
                                        "답변 완료"
                                    ) {
                                        return;
                                    }

                                    // 이전 답변 닫기
                                    if (
                                        openedAnswer &&
                                        openedAnswer !==
                                        answerBox
                                    ) {

                                        openedAnswer.style.display =
                                            "none";
                                    }

                                    // 토글
                                    if (
                                        answerBox.style.display ===
                                        "block"
                                    ) {

                                        answerBox.style.display =
                                            "none";

                                        openedAnswer =
                                            null;

                                    } else {

                                        answerBox.style.display =
                                            "block";

                                        openedAnswer =
                                            answerBox;
                                    }
                                }
                            );

                            questionList.appendChild(
                                row
                            );

                            questionList.appendChild(
                                answerBox
                            );
                        }
                    );
                }

                // 되돌리기 버튼 보이기
                document.getElementById(
                    "resetBtn_m"
                ).style.display =
                    "inline-block";
            }
        );


        // ======================================
        // 되돌리기 기능
        // ======================================

        document.getElementById(
            "resetBtn_m"
        ).addEventListener(
            "click",
            () => {

                // 검색창 초기화
                document.getElementById(
                    "searchInput_m"
                ).value = "";

                // 페이지 버튼 다시 보이기
                pageButtons.style.display =
                    "flex";

                // 현재 페이지 복구
                renderPage(
                    currentPage
                );

                // 되돌리기 버튼 숨김
                document.getElementById(
                    "resetBtn_m"
                ).style.display =
                    "none";
            }
        );



        // ======================================
        // 글쓰기 버튼
        // ======================================

        document
            .getElementById("writeBtn")
            .addEventListener(
                "click",
                () => {

                    const form =
                        document.getElementById(
                            "writeForm"
                        );

                    // 보이기 / 숨기기
                    if (
                        form.style.display
                        === "none"
                    ) {

                        form.style.display =
                            "flex";

                    } else {

                        form.style.display =
                            "none";
                    }
                }
            );


        // ======================================
        // 등록 버튼
        // ======================================

        document
            .getElementById("submitBtn")
            .addEventListener(
                "click",
                () => {

                    const writer =
                        document
                            .getElementById(
                                "writerInput"
                            )
                            .value
                            .trim();

                    const question =
                        document
                            .getElementById(
                                "questionInput"
                            )
                            .value
                            .trim();

                    // 빈칸 검사
                    if (
                        writer === "" ||
                        question === ""
                    ) {

                        alert(
                            "내용을 입력해주세요."
                        );

                        return;
                    }

                    // 질문 추가
                    addQuestion(
                        question,
                        writer
                    );

                    // 입력칸 비우기
                    document
                        .getElementById(
                            "writerInput"
                        ).value = "";

                    document
                        .getElementById(
                            "questionInput"
                        ).value = "";

                    // 입력창 닫기
                    document
                        .getElementById(
                            "writeForm"
                        ).style.display =
                        "none";
                }
            );



















    </script>
</body>

</html>

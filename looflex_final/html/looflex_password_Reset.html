<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>looflex_password_Reset</title>
    <link rel="stylesheet" href="../css/looflex_password_Reset.css">
    <link rel="icon" href="../resource/img/looflex_logo_ico.png">

</head>
<body>
    <img src="../resource/img/looflex_logo.png" alt="">

    <div class="container">
        <div class="inner">
            <div class="info">
                <h3>비밀번호 재설정</h3>
                <div class="text1">영어, 숫자, 특수문자 1개씩을 포함한 8자 이상 입력해 주세요</div>
                <div>
                    <div class="text">비밀번호 재설정</div> 
                    <input type="password" name="newpassword" id="newpassword" placeholder="새 비밀번호">
                    <div class="text2"></div>
                </div>
        
                <div>
                    <div class="text">비밀번호 확인</div> 
                      <input type="password" name="confirmPassword" id="confirmPassword" placeholder="비밀번호 확인">
                      <div class="text2"></div>
                    </div>
                        
                    <div class="link">
                        <button class="btn">비밀번호 변경</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/looflex_password_Reset.js"></script>
</body>
</html>

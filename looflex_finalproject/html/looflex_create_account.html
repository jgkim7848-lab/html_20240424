<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>looflex_create_account</title>
    <link rel="stylesheet" href="../css/looflex_create_account.css">
    <link rel="icon" href="../resource/img/looflex_logo_ico.png">

</head>
<body>

    <img src="../resource/img/looflex_logo.png" alt="">

    <div class="container">
        <div class="inner">
            <h2>회원가입</h2>
            <form action="">
                <div class="login-box">
                    <h3>로그인 정보</h3>
                    <div class="input-idbox">
                        <div class="text">아이디</div> 
                        <input type="text" name="id" id="id" placeholder="8자리 이상 입력해 주세요">
                        <button id="btn">중복확인</button>
                    </div>
                    
                    <div class="text2"></div>
                    
                    <div>
                        <div class="text">비밀번호</div> 
                        <input type="password" name="password" id="password" placeholder="영어, 숫자, 특수문자 1개씩을 포함한 8자 이상 입력해 주세요">
                        <div class="text2"></div>
                    </div>
                    <div>
                        <div class="text">비밀번호 확인 </div>
                        <input type="password" name="confirmPassword" id="confirmPassword" placeholder="비밀번호 재입력">
                        <div class="text2"></div>
                    </div>
                </div>

                <div class="personal-info">
                    <h3>회원 정보</h3>
                    <div>
                        <div class="text2">이름</div> 
                        <input type="text" name="name" id="name" placeholder="이름">
                    </div>

                    <div class="text2">주민등록번호</div> 
                    
                    <div class="numner-box">
                        <input type="text" name="number" id="number1" placeholder="앞의 6자리" class="text3">
                        <span>-</span>
                        <input type="text" name="number" id="number2" placeholder="뒤의 7자리" class="text3">
                    </div>
                    
                    <div class="gender-box">
                        <div class="gender">성별</div> 
                        <label for="m">
                            <input type="radio" name="gender" id="m" value="남성"> 남성
                        </label>
    
                        <label for="w">
                            <input type="radio" name="gender" id="w" value="여성"> 여성
                        </label>
                    </div>
                    <div>
                        <div class="text2">이메일</div> 
                        <input type="email" name="email" id="email" placeholder="이메일">
                    </div>
                    
                    <button type="submit" class="sign_Up">가입하기</button>
                </div>
            </form>
        </div>
    </div>
    <script src="../js/looflex_create_account.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>looflex_login</title>
    <link rel="stylesheet" href="../css/looflex_login.css">
    <link rel="icon" href="../resource/img/looflex_logo_ico.png">

</head>
<body>
    <img src="../resource/img/looflex_logo.png" alt="">

    <div class="container">
        <div class="inner">
            <h2 class="h2">로그인</h2>
            <div class="top">
                <form action="">
                    <input type="text" name="id" id="id" placeholder="아이디" class="text">
                    <input type="password" name="password" id="password" placeholder="비밀번호" class="text">
                    <button type="submit" class="login-button">로그인</button>
                </form>
            </div>
            <div class="bottom">
                <div class="bottom-left">
                    <a href="../html/looflex_create_account.html">회원가입</a>
                </div>
                <div class="bottom-light">
                    <a href="../html/looflex_find_id.html">아이디</a>
                    <a href="../html/looflex_find_password.html">비밀번호 찾기</a>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/looflex_login.js"></script>
</body>
</html>
